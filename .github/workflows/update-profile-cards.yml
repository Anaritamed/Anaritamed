name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *" # diariamente à meia-noite (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile-cards.yml

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Sem o secret PAT, usa o GITHUB_TOKEN, que só enxerga dados públicos.
      # Para contar contribuições privadas, crie um secret "PAT" com os escopos repo e read:user.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=dracula&locale=en
          path: profile/stats.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&card_width=320&langs_count=6&theme=github_dark&locale=pt-br
          path: profile/languages.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git pull --rebase
          git push
